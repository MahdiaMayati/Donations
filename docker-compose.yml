services:

  # ─── SQL Server ───────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: donations-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - donations-net

  # ─── API ──────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_LC}:latest
    container_name: donations-api
    ports:
      - "9999:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DonationDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Connect Timeout=60;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=DonationApi
      - JwtSettings__Audience=DonationUsers
      - JwtSettings__ExpiryMinutes=60
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - donations-net

volumes:
  sqlserver-data:

networks:
  donations-net:
    driver: bridge